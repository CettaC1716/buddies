[package]
name = "buddies-market"
version = "0.1.0"
edition = "2021"
description = "Buddies Blitz On-Chain RESPITE & NEP-171 Fish NFT Marketplace Smart Contract (market.buddiesblitz.testnet)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
