[package]
name = "buddies-market"
version = "1.0.0"
edition = "2021"
description = "Buddies Blitz On-Chain NEP-141 RESPITE, NEP-171/181 Fish & Sub-Account Estate Deeds, and NEP-245 Multi-Token Smart Contract (market.buddiesblitz.testnet)"
repository = "https://github.com/CettaC1716/buddies"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
